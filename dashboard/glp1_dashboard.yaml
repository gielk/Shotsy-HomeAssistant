              - border: none
          cards:
          - type: markdown
            text_only: true
            content: |-
              **Niveau.** Per injectie telt een curve die na ongeveer anderhalve dag piekt en daarna met een halfwaardetijd van ongeveer {{ state_attr('sensor.retatrutide_medicatieniveau', 'half_life_days') }} dagen afneemt. Alle injecties samen geven het geschatte niveau. Voor retatrutide is de curve afgeleid van je Shotsy-export, zodat de getallen vrijwel gelijk zijn. Het is een schatting, geen bloedwaarde.

              **Planning.** De volgende injectie komt het aantal dagen na de vorige, of op de vaste weekdag als die is ingesteld. Met *Datum en tijd* zet je hem eenmalig anders. Na een registratie gaat de planning weer vanzelf.

              **Prikplek.** Standaard de plek die het langst niet is gebruikt.

              **Gewicht.** Elke nieuwe waarde van je gewichtsensor wordt bewaard, ook als Home Assistant de geschiedenis al heeft opgeruimd.

              **Gegevens.** Alles staat lokaal in Home Assistant. Back-up via de actie *Gegevens exporteren*.
