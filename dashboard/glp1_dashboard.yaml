title: Medicatie
button_card_templates:
  glp1_kaart:
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
      - padding: 16px
      img_cell:
      - width: 44px
      - height: 44px
      - border-radius: 50%
      - background: color-mix(in srgb, var(--primary-color) 18%, transparent)
      - align-self: center
      icon:
      - width: 24px
      - color: var(--primary-color)
      name:
      - justify-self: start
      - align-self: end
      - font-size: 15px
      - font-weight: '600'
      - text-align: left
      label:
      - justify-self: start
      - align-self: start
      - font-size: 12.5px
      - color: var(--secondary-text-color)
      - text-align: left
      - white-space: normal
      - margin-top: 2px
  glp1_rond:
    show_name: false
    show_state: false
    show_label: false
    hold_action:
      action: none
    styles:
      card:
      - width: 44px
      - height: 44px
      - border-radius: 50%
      - padding: '0'
      - background: color-mix(in srgb, var(--primary-text-color) 8%, transparent)
      - box-shadow: none
      - border: none
      icon:
      - width: 22px
      - color: var(--primary-text-color)
  glp1_pil:
    show_state: false
    show_label: false
    hold_action:
      action: none
    styles:
      card:
      - height: 36px
      - padding: 0 14px 0 10px
      - border-radius: 18px
      - background: color-mix(in srgb, var(--primary-color) 18%, transparent)
      - box-shadow: none
      - border: none
      grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: auto auto
      - column-gap: 6px
      icon:
      - width: 18px
      - color: var(--primary-color)
      name:
      - font-size: 13px
      - font-weight: '600'
      - color: var(--primary-color)
  glp1_actie:
    show_state: false
    show_label: false
    hold_action:
      action: none
    styles:
      card:
      - height: 44px
      - padding: 0 18px
      - border-radius: 22px
      - background: var(--primary-color)
      - box-shadow: none
      - border: none
      grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: auto auto
      - column-gap: 8px
      icon:
      - width: 20px
      - color: '#fff'
      name:
      - font-size: 14px
      - font-weight: '600'
      - color: '#fff'
  glp1_segment:
    entity: select.retatrutide_grafiekperiode
    show_icon: false
    show_name: true
    show_label: false
    show_state: false
    tap_action:
      action: perform-action
      perform_action: select.select_option
      target:
        entity_id: select.retatrutide_grafiekperiode
      data:
        option: '[[[ return variables.optie; ]]]'
    hold_action:
      action: none
    styles:
      card:
      - padding: 9px 4px
      - border-radius: 12px
      - box-shadow: none
      - border: none
      - background: '[[[ return entity?.state === variables.optie ? ''var(--primary-color)'' : ''color-mix(in srgb, var(--primary-text-color) 8%, transparent)''; ]]]'
      name:
      - font-size: 13px
      - font-weight: '600'
      - color: '[[[ return entity?.state === variables.optie ? ''#fff'' : ''var(--primary-text-color)''; ]]]'
  glp1_rij:
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    hold_action:
      action: none
    styles:
      card:
      - padding: 12px 14px
      grid:
      - grid-template-areas: '"i n right" "i l right"'
      - grid-template-columns: 40px 1fr auto
      - grid-template-rows: auto auto
      - column-gap: 12px
      img_cell:
      - width: 40px
      - height: 40px
      - border-radius: 12px
      - align-self: center
      - background: color-mix(in srgb, var(--primary-color) 18%, transparent)
      icon:
      - width: 22px
      - color: var(--primary-color)
      name:
      - justify-self: start
      - align-self: end
      - font-size: 14px
      - font-weight: '600'
      label:
      - justify-self: start
      - align-self: start
      - font-size: 12px
      - color: var(--secondary-text-color)
      - text-align: left
      - white-space: normal
      custom_fields:
        right:
        - align-self: center
        - display: flex
        - gap: 8px
  glp1_dag:
    show_icon: false
    show_name: true
    show_label: false
    show_state: false
    triggers_update:
    - date.retatrutide_agendadag
    - sensor.retatrutide_dagoverzicht
    - sensor.retatrutide_volgende_injectie
    variables:
      dag: |-
        [[[
        const st = (e) => states[e]?.state;
        const at = (e, a) => states[e]?.attributes?.[a];
        const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const sel = st('date.retatrutide_agendadag') || iso(new Date());
        const [y, m] = sel.split('-').map(Number);
        const offset = (new Date(y, m - 1, 1).getDay() + 6) % 7;
        const n = variables.cel - offset + 1;
        if (n < 1 || n > new Date(y, m, 0).getDate()) return {n: null, iso: sel};
        const day = iso(new Date(y, m - 1, n));
        const info = (at('sensor.retatrutide_dagoverzicht', 'month') || [])[n - 1] || {};
        const due = st('sensor.retatrutide_volgende_injectie');
        const planned = due && !['unknown', 'unavailable'].includes(due) && iso(new Date(due)) === day;
        const dose = at('sensor.retatrutide_volgende_injectie', 'dose_mg');
        return {n, iso: day, info, planned, dose, selected: day === sel, today: day === iso(new Date())};
        ]]]
    name: '[[[ return variables.dag.n ? String(variables.dag.n) : ''''; ]]]'
    custom_fields:
      stip: |-
        [[[
        const d = variables.dag;
        if (!d.n || !d.info.log) return '';
        return `<div style="width:5px;height:5px;border-radius:50%;background:${d.info.dose ? '#fff' : '#F5B82E'};margin:0 auto"></div>`;
        ]]]
    tap_action:
      action: perform-action
      perform_action: date.set_value
      target:
        entity_id: date.retatrutide_agendadag
      data:
        date: '[[[ return variables.dag.iso; ]]]'
    hold_action:
      action: none
    styles:
      card:
      - height: 40px
      - width: 40px
      - padding: '0'
      - margin: 0 auto
      - border-radius: 50%
      - box-shadow: none
      - border: |-
          [[[
          const kleur = (d) => ['#F9A8D4', '#F472B6', '#EC4899', '#DB2777', '#C026D3', '#A21CAF', '#7E22CE', '#6B21A8', '#4C1D95'][Math.max(0, Math.min(8, Math.round(Number(d)) - 1))];
          const d = variables.dag;
          if (d.selected) return '2px solid var(--primary-text-color)';
          if (d.planned && !d.info.dose) return `2px dashed ${kleur(d.dose || 1)}`;
          return '2px solid transparent';
          ]]]
      - background: |-
          [[[
          const kleur = (d) => ['#F9A8D4', '#F472B6', '#EC4899', '#DB2777', '#C026D3', '#A21CAF', '#7E22CE', '#6B21A8', '#4C1D95'][Math.max(0, Math.min(8, Math.round(Number(d)) - 1))];
          const d = variables.dag;
          if (!d.n) return 'none';
          if (d.info.dose) return kleur(d.info.dose);
          if (d.today) return 'color-mix(in srgb, var(--primary-text-color) 14%, transparent)';
          return 'none';
          ]]]
      grid:
      - grid-template-areas: '"n" "stip"'
      - grid-template-rows: 1fr 6px
      name:
      - font-size: 15px
      - align-self: end
      - font-weight: '[[[ return variables.dag.today || variables.dag.selected ? ''700'' : ''400''; ]]]'
      - color: '[[[ return variables.dag.info?.dose ? ''#fff'' : ''var(--primary-text-color)''; ]]]'
      custom_fields:
        stip:
        - align-self: start
  glp1_plek:
    entity: select.retatrutide_volgende_prikplek
    show_icon: false
    show_name: true
    show_label: true
    show_state: false
    triggers_update:
    - sensor.retatrutide_aantal_injecties
    label: |-
      [[[
      const at = (e, a) => states[e]?.attributes?.[a];
      const used = (at('sensor.retatrutide_aantal_injecties', 'injections') || []).find((i) => i.site === variables.plek);
      if (!used) return 'nooit';
      const d = Math.floor((Date.now() - used.t) / 864e5);
      return d === 0 ? 'vandaag' : (d === 1 ? 'gisteren' : `${d} dagen`);
      ]]]
    tap_action:
      action: perform-action
      perform_action: select.select_option
      target:
        entity_id: select.retatrutide_volgende_prikplek
      data:
        option: '[[[ return variables.plek; ]]]'
    hold_action:
      action: none
    styles:
      card:
      - padding: 10px 4px
      - border-radius: 14px
      - box-shadow: none
      - border: '[[[ return entity?.attributes?.options?.includes(variables.plek) ? ''none'' : ''1px dashed var(--divider-color)''; ]]]'
      - background: '[[[ return entity?.state === variables.plek ? ''var(--primary-color)'' : ''color-mix(in srgb, var(--primary-text-color) 6%, transparent)''; ]]]'
      name:
      - font-size: 13px
      - font-weight: '600'
      - color: '[[[ return entity?.state === variables.plek ? ''#fff'' : ''var(--primary-text-color)''; ]]]'
      label:
      - font-size: 11px
      - color: '[[[ return entity?.state === variables.plek ? ''rgba(255,255,255,.85)'' : ''var(--secondary-text-color)''; ]]]'
  glp1_bijwerking:
    template: glp1_rij
    icon: mdi:emoticon-sick-outline
    label: |-
      [[[
      const v = Number(entity?.state) || 0;
      const words = ['Geen', 'Licht', 'Licht', 'Licht', 'Matig', 'Matig', 'Matig', 'Ernstig', 'Ernstig', 'Ernstig', 'Heel ernstig'];
      const dots = Array.from({length: 10}, (_, k) => `<span style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;background:${k < v ? (v >= 7 ? 'var(--error-color, #e45649)' : (v >= 4 ? '#F5B82E' : 'var(--success-color, #4caf50)')) : 'color-mix(in srgb, var(--primary-text-color) 15%, transparent)'}"></span>`).join('');
      return `${words[Math.round(v)]}${v ? ' · ' + v + '/10' : ''}<div style="margin-top:5px">${dots}</div>`;
      ]]]
    tap_action:
      action: more-info
    styles:
      img_cell:
      - background: '[[[ const v = Number(entity?.state) || 0; return v >= 7 ? ''color-mix(in srgb, var(--error-color, #e45649) 18%, transparent)'' : (v >= 4 ? ''color-mix(in srgb, #F5B82E 22%, transparent)''
          : (v > 0 ? ''color-mix(in srgb, var(--success-color, #4caf50) 18%, transparent)'' : ''color-mix(in srgb, var(--primary-text-color) 8%, transparent)'')); ]]]'
      icon:
      - color: '[[[ const v = Number(entity?.state) || 0; return v >= 7 ? ''var(--error-color, #e45649)'' : (v >= 4 ? ''#F5B82E'' : (v > 0 ? ''var(--success-color, #4caf50)'' : ''var(--secondary-text-color)''));
          ]]]'
views:
- title: Medicatie
  path: medicatie
  icon: mdi:needle
  type: sections
  max_columns: 1
  badges: []
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Retatrutide
      icon: mdi:needle
    - type: custom:simple-tabs
      tabs_alignment: start
      remember_tab: true
      tabs:
      - title: Overzicht
        icon: mdi:clipboard-text-outline
        cards:
        - type: custom:button-card
          template: glp1_kaart
          entity: sensor.retatrutide_volgende_injectie
          icon: mdi:needle
          triggers_update:
          - sensor.retatrutide_laatste_injectie
          - sensor.retatrutide_volgende_injectie
          variables:
            v: |-
              [[[
              const st = (e) => states[e]?.state;
              const ok = (e) => { const s = st(e); return s !== undefined && s !== 'unknown' && s !== 'unavailable' && s !== ''; };
              const at = (e, a) => states[e]?.attributes?.[a];
              const e = 'sensor.retatrutide_volgende_injectie', l = 'sensor.retatrutide_laatste_injectie';
              const due = ok(e) ? new Date(st(e)) : null;
              const last = ok(l) ? new Date(st(l)) : null;
              const now = new Date();
              const start = new Date(now); start.setHours(0, 0, 0, 0);
              const days = due ? Math.round((new Date(due).setHours(0, 0, 0, 0) - start) / 864e5) : null;
              return {due, last, now, days, late: due ? now > due : false, dose: at(e, 'dose_mg'), site: at(e, 'site'), n: at(e, 'number')};
              ]]]
          name: |-
            [[[
            const v = variables.v;
            if (!v.due) return 'Nog geen injectie gepland';
            if (v.late) {
              const d = Math.floor((v.now - v.due) / 864e5);
              return d >= 1 ? `${d} ${d === 1 ? 'dag' : 'dagen'} te laat` : 'Tijd voor je injectie';
            }
            if (v.days === 0) return 'Vandaag';
            if (v.days === 1) return 'Morgen';
            return `Over ${v.days} dagen`;
            ]]]
          label: |-
            [[[
            const dag = (t) => new Date(t).toLocaleDateString('nl-NL', {weekday: 'short', day: 'numeric', month: 'short'});
            const tijd = (t) => new Date(t).toLocaleTimeString('nl-NL', {hour: '2-digit', minute: '2-digit'});
            const v = variables.v;
            if (!v.due) return 'Registreer je eerste injectie';
            return `Injectie ${v.n}, ${dag(v.due)} om ${tijd(v.due)}${v.site ? ' · ' + v.site : ''}`;
            ]]]
          custom_fields:
            val: |-
              [[[
              const dosis = (x) => Number(x).toLocaleString('nl-NL', {maximumFractionDigits: 2});
              const d = variables.v.dose;
              return d ? `${dosis(d)}<span style="font-size:17px;font-weight:600;margin-left:2px">mg</span>` : '';
              ]]]
            bar: |-
              [[[
              const dag = (t) => new Date(t).toLocaleDateString('nl-NL', {weekday: 'short', day: 'numeric', month: 'short'});
              const sub = 'color:var(--secondary-text-color)';
              const v = variables.v;
              if (!v.due || !v.last) return '';
              const pct = Math.max(0, Math.min(100, (v.now - v.last) / (v.due - v.last) * 100));
              const col = v.late ? 'var(--error-color, #e45649)' : 'var(--primary-color)';
              return `<div style="position:relative;height:10px;border-radius:5px;background:color-mix(in srgb, var(--primary-text-color) 10%, transparent);overflow:hidden">
              <div style="position:absolute;top:0;bottom:0;left:0;width:${pct}%;background:${col};border-radius:5px"></div></div>
              <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;${sub}"><span>Vorige <b style="color:var(--primary-text-color)">${dag(v.last)}</b></span><span>Volgende <b style="color:var(--primary-text-color)">${dag(v.due)}</b></span></div>`;
              ]]]
            knop:
              card:
                type: custom:button-card
                template: glp1_actie
                icon: mdi:check
                name: Injectie gezet
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.retatrutide_injectie_registreren
                  confirmation:
                    text: |-
                      [[[
                      const at = (e, a) => states[e]?.attributes?.[a];
                      const dosis = (x) => Number(x).toLocaleString('nl-NL', {maximumFractionDigits: 2});
                      const e = 'sensor.retatrutide_volgende_injectie';
                      return `Injectie ${at(e, 'number')} registreren: ${dosis(at(e, 'dose_mg'))} mg in ${at(e, 'site') || 'geen plek'}, nu?`;
                      ]]]
            wijzig:
              card:
                type: custom:button-card
                template: glp1_pil
                icon: mdi:calendar-edit
                name: Datum
                tap_action:
                  action: more-info
                  entity: datetime.retatrutide_volgende_injectie
          styles:
            grid:
            - grid-template-areas: '"i n val" "i l val" "bar bar bar" "knop knop wijzig"'
            - grid-template-columns: 44px 1fr auto
            - grid-template-rows: auto auto auto auto
            - column-gap: 12px
            img_cell:
            - background: '[[[ return variables.v.late ? ''color-mix(in srgb, var(--error-color, #e45649) 18%, transparent)'' : ''color-mix(in srgb, var(--primary-color) 18%, transparent)''; ]]]'
            icon:
            - color: '[[[ return variables.v.late ? ''var(--error-color, #e45649)'' : ''var(--primary-color)''; ]]]'
            custom_fields:
              val:
              - align-self: center
              - justify-self: end
              - font-size: 34px
              - font-weight: '700'
              - line-height: '1'
              bar:
              - margin-top: 16px
              - justify-self: stretch
              knop:
              - margin-top: 14px
              - justify-self: start
              wijzig:
              - margin-top: 14px
              - justify-self: end
              - align-self: center
        - type: custom:button-card
          template: glp1_kaart
          entity: sensor.retatrutide_medicatieniveau
          icon: mdi:chart-bell-curve-cumulative
          tap_action:
            action: more-info
          name: Geschat medicatieniveau
          label: |-
            [[[
            const at = (e, a) => states[e]?.attributes?.[a];
            const nl = (x, d = 1) => x === null || x === undefined || x === '' || Number.isNaN(Number(x)) ? '—' : Number(x).toLocaleString('nl-NL', {minimumFractionDigits: d, maximumFractionDigits: d});
            const dag = (t) => new Date(t).toLocaleDateString('nl-NL', {weekday: 'short', day: 'numeric', month: 'short'});
            const e = 'sensor.retatrutide_medicatieniveau';
            const peak = at(e, 'peak_next_7_days'), pt = at(e, 'peak_time');
            const parts = [`Vandaag gemiddeld ${nl(at(e, 'today_average'), 2)} mg`];
            if (peak && pt) parts.push(`piek ${nl(peak, 1)} mg op ${dag(pt)}`);
            return parts.join(' · ');
            ]]]
          custom_fields:
            val: |-
              [[[
              const st = (e) => states[e]?.state;
              const ok = (e) => { const s = st(e); return s !== undefined && s !== 'unknown' && s !== 'unavailable' && s !== ''; };
              const num = (e) => { const v = Number(st(e)); return ok(e) && Number.isFinite(v) ? v : null; };
              const nl = (x, d = 1) => x === null || x === undefined || x === '' || Number.isNaN(Number(x)) ? '—' : Number(x).toLocaleString('nl-NL', {minimumFractionDigits: d, maximumFractionDigits: d});
              return `${nl(num('sensor.retatrutide_medicatieniveau'), 2)}<span style="font-size:17px;font-weight:600;margin-left:2px">mg</span>`;
              ]]]
          styles:
            grid:
            - grid-template-areas: '"i n val" "i l val"'
            - grid-template-columns: 44px 1fr auto
            - column-gap: 12px
            custom_fields:
              val:
              - align-self: center
              - font-size: 30px
              - font-weight: '700'
              - line-height: '1'
        - type: custom:apexcharts-card
          graph_span: 35d
          span:
            offset: +14d
          update_interval: 10min
          now:
            show: true
            label: Nu
            color: '#8a8a8a'
          header:
            show: true
            title: Niveau, 3 weken terug en 2 vooruit
            show_states: false
          apex_config:
            chart:
              height: 200
            legend:
              show: true
              position: top
              horizontalAlign: left
              fontSize: 12px
            grid:
              strokeDashArray: 3
              borderColor: rgba(127,127,127,0.18)
            tooltip:
              x:
                format: ddd d MMM HH:mm
          yaxis:
          - min: 0
            decimals: 0
            apex_config:
              tickAmount: 4
          series:
          - entity: sensor.retatrutide_medicatieniveau
            name: Niveau
            type: area
            color: '#A21CAF'
            opacity: 0.2
            stroke_width: 2
            unit: mg
            float_precision: 2
            extend_to: false
            show:
              legend_value: false
            data_generator: return (entity.attributes.series || []).filter((p) => p[0] <= Date.now());
          - entity: sensor.retatrutide_medicatieniveau
            name: Met geplande prik
            type: line
            color: '#A21CAF'
            stroke_width: 2
            stroke_dash: 4
            unit: mg
            float_precision: 2
            extend_to: false
            show:
              legend_value: false
            data_generator: return (entity.attributes.planned || []).filter((p) => p[0] >= Date.now() - 3 * 36e5);
        - type: custom:button-card
          show_icon: false
          show_name: false
          show_state: false
          show_label: false
          tap_action:
            action: none
          hold_action:
            action: none
          triggers_update:
          - sensor.retatrutide_aantal_injecties
          - sensor.retatrutide_laatste_dosis
          - sensor.retatrutide_gewicht
          - sensor.retatrutide_gewicht_verandering
          custom_fields:
            tegels: |-
              [[[
              const st = (e) => states[e]?.state;
              const ok = (e) => { const s = st(e); return s !== undefined && s !== 'unknown' && s !== 'unavailable' && s !== ''; };
              const num = (e) => { const v = Number(st(e)); return ok(e) && Number.isFinite(v) ? v : null; };
              const nl = (x, d = 1) => x === null || x === undefined || x === '' || Number.isNaN(Number(x)) ? '—' : Number(x).toLocaleString('nl-NL', {minimumFractionDigits: d, maximumFractionDigits: d});
              const dosis = (x) => Number(x).toLocaleString('nl-NL', {maximumFractionDigits: 2});
              const dag = (t) => new Date(t).toLocaleDateString('nl-NL', {weekday: 'short', day: 'numeric', month: 'short'});
              const sub = 'color:var(--secondary-text-color)';
              const ICON = '--mdc-icon-size:16px;width:16px;height:16px;margin:0;display:inline-flex;flex:none';
              const tile = (icon, label, value, extra) => `<div style="padding:12px 10px;border-radius:14px;background:color-mix(in srgb, var(--primary-text-color) 5%, transparent);text-align:left">
              <div style="display:flex;align-items:center;gap:6px;font-size:12px;${sub}"><ha-icon icon="${icon}" style="${ICON};color:var(--primary-color)"></ha-icon>${label}</div>
              <div style="font-size:22px;font-weight:700;margin-top:6px;line-height:1.1">${value}</div>
              <div style="font-size:11.5px;${sub};margin-top:3px">${extra}</div></div>`;
              const change = num('sensor.retatrutide_gewicht_verandering');
              const last = num('sensor.retatrutide_laatste_dosis');
              return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
